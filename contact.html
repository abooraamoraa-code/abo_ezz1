<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتصل بالإدارة - POKI MEGA ENTERPRISE 2.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root { --bg: #ffffff; --text: #0a0a0a; --accent: #000000; --border: #e0e0e0; --card-bg: #fafafa; }
* { box-sizing: border-box; transition: all 0.25s ease; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; line-height: 1.8; }
header { background: #ffffff; border-bottom: 4px solid var(--accent); padding: 40px 20px; text-align: center; }
.container { max-width: 900px; margin: 50px auto; padding: 0 25px; }
.section-card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 20px; padding: 45px; margin-bottom: 40px; }
.inp, textarea { width: 100%; padding: 14px 18px; margin: 12px 0 24px; background: #fff; border: 2px solid var(--border); color: #111; border-radius: 12px; font-size: 15px; }
textarea { resize: vertical; min-height: 120px; }
label { font-weight: 700; color: #222; display: block; margin-bottom: 5px; }
.btn-submit { background: #000; color: #fff; border: 2px solid #000; padding: 15px 30px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; width: 100%; }
.btn-submit:hover { background: #333; }
</style>
</head>
<body>

<header>
    <h1>💬 اتصل بالإدارة العليا</h1>
    <p>إشراف وتطوير: أبو العز العمري</p>
</header>

<div class="container">
    <div class="section-card">
        <h2>📩 أرسل رسالة إلى الإدارة</h2>
        <label>الاسم الكريم:</label>
        <input type="text" id="cName" class="inp" placeholder="أدخل اسمك">
        <label>البريد الإلكتروني:</label>
        <input type="email" id="cEmail" class="inp" placeholder="name@example.com">
        <label>نص الرسالة:</label>
        <textarea id="cMsg" class="inp" placeholder="اكتب رسالتك هنا..."></textarea>
        <button class="btn-submit" onclick="sendContactMessage()">إرسال الرسالة سحابياً 🚀</button>
        <p id="contactStatus" style="margin-top:15px;font-weight:bold;text-align:center;"></p>
    </div>
</div>

<script>
// الاتصال بقاعدة بياناتك الجديدة المحدثة
const SUPABASE_URL = 'https://tmwknvhxwfndrrhumvqo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Q0E47jEIc-aFTJkWKOGB9w_EX576xvO';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function sendContactMessage() {
    let name = document.getElementById('cName').value.trim();
    let email = document.getElementById('cEmail').value.trim();
    let message = document.getElementById('cMsg').value.trim();
    let status = document.getElementById('contactStatus');

    if(!name || !email || !message) {
        status.innerText = 'يرجى تعبئة جميع الحقول!';
        status.style.color = 'red';
        return;
    }

    let { error } = await _supabase.from('messages').insert([{ name: name, email: email, message: message }]);
    if(error) {
        status.innerText = 'حدث خطأ أثناء الإرسال!';
        status.style.color = 'red';
    } else {
        status.innerText = '✨ تم إرسال رسالتك بنجاح!';
        status.style.color = 'green';
        document.getElementById('cName').value = '';
        document.getElementById('cEmail').value = '';
        document.getElementById('cMsg').value = '';
    }
}
</script>
</body>
</html>
